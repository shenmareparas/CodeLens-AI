<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-opacity="0.3" flood-color="#000000" />
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="32" height="32" rx="7.5" fill="url(#bgGrad)" />
  <!-- Inner subtle border highlight -->
  <rect width="30" height="30" x="1" y="1" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
  <!-- CodeLens Symbol -->
  <g filter="url(#glow)">
    <!-- Lens circle -->
    <circle cx="14" cy="14" r="7.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
    <!-- Lens handle -->
    <line x1="19.5" y1="19.5" x2="25.5" y2="25.5" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" />
    <!-- Lens inner focus crosshair -->
    <line x1="10.5" y1="14" x2="17.5" y2="14" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="14" y1="10.5" x2="14" y2="17.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <!-- Lens center spark -->
    <circle cx="14" cy="14" r="1.2" fill="#fef3c7" />
  </g>
</svg>
